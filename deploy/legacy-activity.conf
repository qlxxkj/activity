# activity.70kj.vip → openship edge legacy vhost（仿 legacy-gym.conf）
# 安装：sudo cp /home/hawk/activity/deploy/legacy-activity.conf /var/lib/openship/edge/sites-enabled/legacy-activity.conf
#       docker exec openship-edge kill -HUP 1
# 前置：先签好 /etc/letsencrypt/live/activity.70kj.vip/（见下）

server {
    listen 443 ssl;
    server_name activity.70kj.vip;
    ssl_certificate     /etc/letsencrypt/live/activity.70kj.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/activity.70kj.vip/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3351;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    access_log /dev/stdout;
}

server {
    listen 80;
    server_name activity.70kj.vip;
    location / { return 301 https://$host$request_uri; }
}
